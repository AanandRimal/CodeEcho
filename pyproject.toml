[project]
name = "codeecho"
version = "0.1.0"
description = "Reuse-aware code search and duplicate review for developers and AI coding agents"
requires-python = ">=3.11"

[project.scripts]
codeecho = "codeecho.cli:app"

[tool.setuptools.packages.find]
include = ["codeecho*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
